[delayed_gcode setdisplayneopixel]
initial_duration: 2
gcode:
    {% for count in range(printer["neopixel neo"].color_data|length) %}
        SET_LED LED=neo RED=1 GREEN=0 BLUE=0 INDEX={count +1}
        G4 P100
    {% endfor %}
    SET_LED LED=neo RED=1 GREEN=0 BLUE=0
    G4 P200
    SET_LED LED=neo RED=0 GREEN=1 BLUE=0
    G4 P200
    SET_LED LED=neo RED=0 GREEN=0 BLUE=1
    G4 P400
    SET_LED LED=neo RED=1 GREEN=1 BLUE=1

# Temperature reactive Neopixel V3
# First half of the chain shows extruder heat-up (blue -> red), second
# half shows bed heat-up (blue -> red). Called repeatedly from the
# heat-up loop in START_PRINT/RESUME; each call re-evaluates the live
# temperatures (own macro = fresh Jinja context) and sends ONE chain
# transmit, then pauses 1s. Does nothing once both targets are reached,
# so the surrounding for-loop drains instantly afterwards.
[gcode_macro _templedcolor_timer]
gcode:
  {% set pixelcount = (printer["neopixel neo"].color_data|length / 2)|int %}
  {% set e_heating = printer.extruder.target|int > 0 and printer.extruder.temperature < printer.extruder.target %}
  {% set b_heating = printer['heater_bed'].target|int > 0 and printer['heater_bed'].temperature < printer['heater_bed'].target %}
  {% if e_heating or b_heating %}
    ### extruder half (index 1..pixelcount)
    {% if printer.extruder.target|int > 0 %}
      {% set ratio = [printer.extruder.temperature / printer.extruder.target, 1.0]|min|round(2) %}
    {% else %}
      {% set ratio = 0 %}
    {% endif %}
    {% for count in range(pixelcount) %}
      SET_LED LED=neo RED={ratio} GREEN=0 BLUE={(1-ratio)|round(2)} INDEX={count +1} TRANSMIT=0
    {% endfor %}
    ### bed half (index pixelcount+1..2*pixelcount)
    {% if printer['heater_bed'].target|int > 0 %}
      {% set ratio = [printer['heater_bed'].temperature / printer['heater_bed'].target, 1.0]|min|round(2) %}
    {% else %}
      {% set ratio = 0 %}
    {% endif %}
    {% for count in range(pixelcount) %}
      SET_LED LED=neo RED={ratio} GREEN=0 BLUE={(1-ratio)|round(2)} INDEX={count + pixelcount +1} TRANSMIT={1 if count == pixelcount - 1 else 0}
    {% endfor %}
    G4 P1000
  {% endif %}